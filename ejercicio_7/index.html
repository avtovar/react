<!doctype html>
<!-- ↑ Declara HTML5: la versión moderna del lenguaje -->
<html lang="es">
  <!-- ↑ lang="es" le dice al navegador/lector de pantalla que el sitio está en español -->
  <head>
    <!-- ↑ Zona de metadatos: información que NO se ve pero el navegador sí usa -->
    <meta charset="UTF-8" />
    <!-- ↑ Codificación de caracteres: permite acentos y ñ correctamente -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ↑ Ícono del sitio (favicon) que aparece en la pestaña del navegador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ↑ Hace que la página sea responsive: se adapta al ancho de la pantalla -->
    <title>ejercicio_7 — Navegación con React Router</title>
    <!-- ↑ Texto que aparece en la pestaña del navegador -->
  </head>
  <body>
    <!-- ↑ Cuerpo: el HTML visible. React dibuja TODO acá adentro -->
    <div id="root"></div>
    <!-- ↑ El "hueco" donde React monta la aplicación (lo busca main.jsx) -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- ↑ Carga el JavaScript de entrada como módulo ES6 -->
  </body>
</html>
